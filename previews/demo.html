<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Basic Site — interactive starter</title><style>
:root{--accent:#6267b0;--bg:#fff;--surface:#f1f3f8;--text:#293448;--muted:#69758a;--border:#e1e5ee;--on-accent:#fff;--soft:#e9ecf8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.logo{font-size:19px;letter-spacing:-.7px;font-weight:700;display:flex;gap:9px;align-items:center}.logo-mark{font-size:26px;color:var(--accent)}.site-header{padding:19px 6%;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;background:var(--bg);z-index:2}.links{display:flex;gap:18px;align-items:center;font-size:14px}.links>a:hover,.links summary:hover{color:var(--accent)}.mobile-menu{display:none}.btn{border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;padding:11px 17px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,transform .15s}.btn:hover{background:var(--soft);transform:translateY(-1px)}.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.btn.primary:hover{filter:brightness(.9)}.hero{padding:65px 7% 55px;display:grid;grid-template-columns:1.1fr 1fr;gap:35px;align-items:center}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent)}h1{font-size:clamp(32px,5vw,53px);font-weight:650;letter-spacing:-2px;line-height:1.1;margin:17px 0}p{font-size:16px;line-height:1.8;color:var(--muted)}.hero p{max-width:410px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.art{height:250px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display ckground:none;border:0;border-radius:4px;text-align:left;color:var(--text);padding:10px 12px;font-size:14px}.menu button:hover,.menu a:hover{background:var(--soft);color:var(--accent)}.tip{position:relative}.tip:hover:after,.tip:focus-visible:after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:0;background:var(--text);color:var(--bg);font-size:12px;line-height:1.5;padding:8px 11px;border-radius:5px;min-width:175px;z-index:8;text-align:left;font-weight:400}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);border-radius:7px;background:var(--text);color:var(--bg);padding:13px 20px;font-size:14px;z-index:10;box-shadow:0 4px 20px #0002;max-width:90%}.app-shell{min-height:100vh;background:var(--surface)}.app-header{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px 24px;background:var(--bg);border-bottom:1px solid var(--border)}.app-menus{display:flex;gap:20px;font-size:14px}.app-layout{display:grid;grid-template-columns:145px 1fr;min-height:calc(100vh - 68px)}.rail{padding:24px 14px;background:var(--bg);border-right:1px solid var(--border)}.rail button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:12px 10px;color:var(--muted);font-size:14px;margin-bottom:5px}.rail button:hover,.rail button.active{background:var(--soft);color:var(--accent)}.app-content{padding:28px;min-width:0}.app-content h1{font-size:29px;letter-spacing:-1px;margin:8px 0 12px}.page-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}.page-heading p{font-size:14px;margin:0}.panel{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:21px;margin:16px 0}.panel h2{font-size:17px;margin:0 0 17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--bg);padding:20px;border:1px solid var(--border);border-radius:8px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;margin-top:10px;font-size:26px;letter-spacing:-1px}.chart{height:150px;display:flex;gap:12px;align-items:end;padding-top:15px;border-bottom:1px solid var(--border)}.chart button{border:0;flex:1;background:var(--accent);opacity:.65;border-radius:4px 4px 0 0;position:relative}.chart button:hover{opacity:1}.chart button:nth-child(even){opacity:.35}.chart-labels{display:flex;justify-content:space-around;font-size:11px;color:var(--muted);padding-top:10px}.period{width:auto}.panel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.panel-top h2{margin:0}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.column{padding:13px;background:var(--soft);border-radius:7px}.column h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 15px}.task{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:10px;font-size:14px}.task p{font-size:12px}.task button{border:0;background:var(--surface);color:var(--accent);padding:6px 9px;border-radius:4px;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--border);white-space:nowrap}th{font-size:12px;color:var(--muted);font-weight:500}td .btn{font-size:12px;padding:5px 9px}.pill{border-radius:4px;background:var(--soft);color:var(--accent);padding:5px 8px;font-size:12px}.search-row{display:flex;gap:12px;align-items:center}.popup-wrap{display:grid;place-items:start center;padding:45px 20px;background:var(--surface);min-height:100vh}.popup{width:340px;max-width:100%;border-radius:12px;background:var(--bg);border:1px solid var(--border);box-shadow:0 8px 30px #0001;overflow:hidden}.popup-heading{padding:23px;border-bottom:1px solid var(--border)}.popup-heading p{font-size:14px;margin-bottom:0}.popup-body{padding:22px}.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);font-size:14px}.toggle-row input{width:36px;height:20px;accent-color:var(--accent);cursor:pointer}.popup textarea{margin:20px 0 12px}.popup .btn{width:100%}.demo-label{color:var(--muted);font-size:12px;text-align:center;padding:13px}.editor{min-height:370px;outline:0;padding:30px 35px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:16px;line-height:1.9}.editor h2{font-size:26px}.word-count{font-size:12px;color:var(--muted);margin-top:12px;text-align:right}dialog{background:var(--bg);color:var(--text);max-width:420px;width:calc(100% - 30px);padding:30px;border:1px solid var(--border);border-radius:10px}dialog::backdrop{background:#0006}dialog h2{font-size:24px;letter-spacing:-.7px}.focus .rail{display:none}.focus .app-layout{grid-template-columns:1fr}pre{font-size:13px;line-height:1.9;white-space:pre-wrap;color:var(--text)}.message{font-size:14px;color:var(--accent);line-height:1.7}.hidden{display:none!important}

</style></head><body><div id="root"></div><dialog id="info"><h2 id="info-title"></h2><p id="info-text"></p><button class="btn primary" id="close-info">Close</button></dialog><script>
// Download packages insert fixed settings here. The gallery uses URL parameters.
const FIXED_CONFIG = null;
const params=new URLSearchParams(location.search);const kind=FIXED_CONFIG?.kind||params.get('kind')||'site';
const palettes={original:['#6267b0','#ffffff','#f1f3f8','#293448','#69758a','#e1e5ee','#ffffff','#e9ecf8'],lcars:['#ffb879','#16131d','#262132','#ede5fa','#b9accb','#443953','#16131d','#4b355b'],cyberpunk:['#e8ff59','#141728','#22253b','#f2f2ff','#b1b2cf','#3c3e58','#141728','#3c294f'],windows:['#0078d4','#ffffff','#f2f7fc','#243447','#63788d','#d8e5f0','#ffffff','#e3f1ff'],cherry:['#b84b78','#fffafb','#faedf2','#513343','#8c6679','#ecd8e2','#ffffff','#f5dae6'],spring:['#3d7c52','#fcfef9','#f0f5e8','#293e31','#657960','#dce7d1','#ffffff','#e3efcf']};
function setTheme(id){const values=palettes[id]||palettes.original;['accent','bg','surface','text','muted','border','on-accent','soft'].forEach((key,i)=>document.documentElement.style.setProperty('--'+key,values[i]));document.documentElement.dataset.theme=id}
setTheme(FIXED_CONFIG?.theme||params.get('theme')||'original');window.addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data?.type==='organon-theme')setTheme(e.data.theme)});
const root=document.querySelector('#root');function toast(text){document.querySelector('.toast')?.remove();const node=document.createElement('div');node.className='toast';node.role='status';node.textContent=text;document.body.append(node);setTimeout(()=>node.remove(),3000)}
function info(title,text){document.querySelector('#info-title').textContent=title;document.querySelector('#info-text').textContent=text;document.querySelector('#info').showModal()}
document.querySelector('#close-info').onclick=()=>document.querySelector('#info').close();
const lorem='Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.';
const logo='<a class="logo" href="#home"><span class="logo-mark">◈</span> logo</a>';
function site(){document.title='Basic Site — blank website template';root.innerHTML=`<header class="site-header" id="home">${logo}<button class="btn mobile-menu" aria-label="Toggle navigation" aria-expanded="false">Menu</button><nav class="links" aria-label="Main navigation"><a href="#home">Home</a><a href="#about">About</a><details><summary>Services</summary><div class="menu"><a href="#features">Lorem ipsum</a><a href="#features">Dolor sit amet</a><a href="#contact">Get in touch</a></div></details><a href="#contact">Contact</a></nav></header><main><section class="hero"><div><span class="eyebrow">YOUR NEXT CHAPTER</span><h1>Lorem ipsum.<br>Dolor sit amet.</h1><p>${lorem}</p><div class="actions"><a class="btn primary tip" data-tip="Explore the sample feature section" href="#features">Get started</a><a class="btn" href="#about">Learn more</a></div></div><div class="art" role="img" aria-label="Abstract placeholder artwork"><span></span></div></section><section class="section" id="features"><span class="eyebrow">A LITTLE OF EVERYTHING</span><h2>Consectetur adipiscing.</h2><p class="section-intro">${lorem}</p><div class="feature-grid">${[['◇','Lorem ipsum'],['◎','Dolor sit amet'],['▧','Sed do eiusmod']].map(([s,t])=>`<article class="feature-card"><span class="symbol">${s}</span><h3>${t}</h3><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p><button class="btn inline-link" data-feature="${t}">Learn more</button></article>`).join('')}</div></section><section class="section" id="about"><span class="eyebrow">ROOM FOR YOUR STORY</span><h2>Ut enim ad minim veniam.</h2><p class="section-intro">${lorem} Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p><button class="btn tip" data-tip="A sample dialog with placeholder information" id="about-more">More information</button></section><section class="section contact-grid" id="contact"><div><span class="eyebrow">SAY HELLO</span><h2>Lorem ipsum dolor.</h2><p>${lorem}</p><p class="message">Demo form · submissions stay in this browser.</p></div><form class="contact-form"><label>Name<input name="name" required placeholder="Lorem Ipsum" autocomplete="name"></label><label>Email<input name="email" required type="email" placeholder="hello@example.com" autocomplete="email"></label><label>Message<textarea name="message" required placeholder="Lorem ipsum dolor sit amet…"></textarea></label><button class="btn primary" type="submit">Send message</button><span id="form-status" class="message" role="status"></span></form></section></main><footer class="site-footer"><span>© ${new Date().getFullYear()} Your website</span><span><a href="#home">Back to top</a> &nbsp; · &nbsp; <a href="#contact">Contact</a></span></footer>`;document.querySelector('.mobile-menu').onclick=e=>{const open=document.querySelector('.links').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',open)};document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>info(b.dataset.feature,lorem));document.querySelector('#about-more').onclick=()=>info('Lorem ipsum',lorem);document.querySelector('.contact-form').onsubmit=e=>{e.preventDefault();document.querySelector('#form-status').textContent='Demo message received. Nothing was sent or stored.';e.target.reset()};document.querySelectorAll('.links a').forEach(a=>a.onclick=()=>{document.querySelectorAll('details').forEach(d=>d.open=false);document.querySelector('.links').classList.remove('open');document.querySelector('.mobile-menu').setAttribute('aria-expanded','false')})}
const menus=`<div class="app-menus"><details><summary>File</summary><div class="menu"><button data-action="new">New</button><button data-action="save">Save</button></div></details><details><summary>Edit</summary><div class="menu"><button data-action="reset">Reset demo</button><button data-action="help">Preferences</button></div></details><details><summary>View</summary><div class="menu"><button data-action="focus">Toggle focus mode</button><button data-action="help">About this preview</button></div></details></div>`;
const names={dashboard:'Overview',board:'Workspace',table:'Data Room',extension:'Pocket Panel',editor:'Blank Page'};
function shell(content){document.title=names[kind]+' — layout study';root.innerHTML=`<div class="app-shell"><header class="app-header">${logo}${menus}</header><div class="app-layout"><aside class="rail"><button class="active" data-nav="main">${names[kind]}</button><button data-nav="settings">Settings</button><button data-nav="help">Help</button></aside><main class="app-content">${content}</main></div></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='settings')info('Settings','This layout responds to the color palette selected in the gallery. Connect your application settings here.');if(b.dataset.nav==='help')info('Interactive layout study','These controls use sample data. No accounts, external services, or live databases are connected.')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action;document.querySelectorAll('details').forEach(d=>d.open=false);if(action==='focus')document.body.classList.toggle('focus');if(action==='help')info('Layout study',lorem);if(action==='reset'){if(kind==='editor'){document.querySelector('.editor').innerHTML=editorText;countWords()}else if(kind==='board'){tasks=[...initialTasks.map(t=>({...t}))];drawBoard()}else if(kind==='table'){records=[...initialRecords.map(r=>({...r}))];drawTable()}else toast('Demo is ready.')}if(action==='save'){if(kind==='editor'){const blob=new Blob([document.querySelector('.editor').innerText],{type:'text/plain'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='untitled.txt';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}else toast('Demo saved for this preview session.')}if(action==='new'){if(kind==='editor'){document.querySelector('.editor').innerHTML='<p><br></p>';countWords()}else if(kind==='board')addTask();else if(kind==='table')document.querySelector('#add-record').click();else info('New item','Lorem ipsum dolor sit amet.')}})}
function dashboard(){shell(`<div class="page-heading"><div><span class="eyebrow">AT A GLANCE</span><h1>Your overview.</h1><p>Lorem ipsum dolor sit amet.</p></div></div><div class="stats">${[['Total items','128'],['In progress','24'],['Completed','86']].map(([l,n])=>`<div class="stat"><span>${l}</span><strong>${n}</strong></div>`).join('')}</div><section class="panel"><div class="panel-top"><h2>Activity</h2><select class="period" aria-label="Activity period"><option value="week">This week</option><option value="last">Last week</option></select></div><div class="chart"></div><div class="chart-labels">${['M','T','W','T','F','S','S'].map(l=>`<span>${l}</span>`).join('')}</div></section><section class="panel"><h2>Recent activity</h2><p>${lorem}</p><button class="btn" id="activity">View details</button></section>`);function chart(){const values=document.querySelector('.period').value==='week'?[40,64,47,82,68,95,75]:[65,44,73,54,84,62,90];document.querySelector('.chart').innerHTML=values.map((v,i)=>`<button style="height:${v}%" title="${v} items" aria-label="Day ${i+1}: ${v} items" data-value="${v}"></button>`).join('');document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>toast(b.dataset.value+' sample items'))}document.querySelector('.period').onchange=chart;chart();document.querySelector('#activity').onclick=()=>info('Recent activity',lorem)}
const initialTasks=[{name:'Lorem ipsum',stage:0},{name:'Dolor sit amet',stage:0},{name:'Consectetur',stage:1},{name:'Adipiscing elit',stage:2}];let tasks=initialTasks.map(t=>({...t}));
function drawBoard(){document.querySelector('.board').innerHTML=['To do','In progress','Done'].map((name,stage)=>`<section class="column"><h2>${name}</h2>${tasks.map((t,i)=>t.stage===stage?`<article class="task"><strong>${escapeHTML(t.name)}</strong><p>Lorem ipsum dolor sit amet.</p><button data-move="${i}">${stage===2?'Start again':'Move to '+['','in progress','done'][stage+1]}</button></article>`:'').join('')}</section>`).join('');document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{tasks[Number(b.dataset.move)].stage=(tasks[Number(b.dataset.move)].stage+1)%3;drawBoard()})}
function addTask(){const title=prompt('Task title','Lorem ipsum');if(title?.trim()){tasks.push({name:title.trim(),stage:0});drawBoard()}}
function board(){shell(`<div class="page-heading"><div><span class="eyebrow">A LITTLE ROOM TO WORK</span><h1>Project workspace.</h1><p>Lorem ipsum dolor sit amet.</p></div><button class="btn primary" id="add-task">+ Add task</button></div><div class="board"></div>`);document.querySelector('#add-task').onclick=addTask;drawBoard()}
function escapeHTML(text){return text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const initialRecords=[{name:'Lorem ipsum',status:'Active'},{name:'Dolor sit amet',status:'Draft'},{name:'Consectetur',status:'Active'},{name:'Adipiscing elit',status:'Archived'},{name:'Sed do eiusmod',status:'Active'}];let records=initialRecords.map(r=>({...r}));
function drawTable(){const query=document.querySelector('#record-search').value.toLowerCase();document.querySelector('tbody').innerHTML=records.map((r,i)=>r.name.toLowerCase().includes(query)?`<tr><td>${String(i+1).padStart(3,'0')}</td><td>${escapeHTML(r.name)}</td><td><span class="pill">${r.status}</span></td><td><button class="btn" data-delete="${i}" aria-label="Delete ${escapeHTML(r.name)}">Delete</button></td></tr>`:'').join('')||'<tr><td colspan="4">No matching records.</td></tr>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{records.splice(Number(b.dataset.delete),1);drawTable()})}
function table(){shell(`<div class="page-heading"><div><span class="eyebrow">EVERYTHING IN ITS PLACE</span><h1>All records.</h1><p>Sample data · browser session only</p></div><button class="btn primary" id="add-record">+ New</button></div><div class="search-row"><input id="record-search" type="search" placeholder="Search records…" aria-label="Search records"><button class="btn" id="schema">Schema</button></div><section class="panel table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Actions</th></tr></thead><tbody></tbody></table></section>`);document.querySelector('#record-search').oninput=drawTable;document.querySelector('#add-record').onclick=()=>{const name=prompt('Record name','Lorem ipsum');if(name?.trim()){records.push({name:name.trim(),status:'Draft'});drawTable()}};document.querySelector('#schema').onclick=()=>info('Example schema','records: id (integer, primary key), name (text), status (text). This is a visual database starter; there is no live database connection.');drawTable()}
function extension(){document.title='Pocket Panel — popup study';root.innerHTML=`<div class="popup-wrap"><div><section class="popup"><header class="popup-heading">${logo}<p>Lorem ipsum dolor sit amet.</p></header><div class="popup-body">${['Enable extension','Show highlights','Quick actions'].map((l,i)=>`<label class="toggle-row">${l}<input type="checkbox" role="switch" ${i===2?'':'checked'}></label>`).join('')}<label style="margin-top:18px">Quick note<textarea placeholder="Lorem ipsum dolor sit amet…" id="quick-note"></textarea></label><button class="btn primary" id="save-note">Save note</button><button class="btn" id="popup-help" style="margin-top:9px">Settings</button><p class="message" id="note-status" role="status"></p></div></section><p class="demo-label">Extension popup simulation · no browser permissions</p></div></div>`;document.querySelectorAll('[role="switch"]').forEach(el=>el.onchange=()=>toast('Demo preference '+(el.checked?'enabled':'disabled')));document.querySelector('#save-note').onclick=()=>{document.querySelector('#note-status').textContent=document.querySelector('#quick-note').value.trim()?'Note saved for this preview session.':'Enter a note first.'};document.querySelector('#popup-help').onclick=()=>info('Settings',lorem)}
const editorText='<h2>Lorem ipsum dolor.</h2><p>'+lorem+'</p><p>Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>';
function countWords(){const text=document.querySelector('.editor').innerText.trim();document.querySelector('.word-count').textContent=(text?text.split(/\s+/).length:0)+' words · editable demo'}
function editor(){shell(`<div class="page-heading"><div><span class="eyebrow">A LITTLE SPACE TO THINK</span><h1>Untitled document.</h1></div></div><div class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Document editor">${editorText}</div><div class="word-count" role="status"></div>`);document.querySelector('.editor').addEventListener('input',countWords);countWords()}
({site,dashboard,board,table,extension,editor}[kind]||site)();
document.addEventListener('click',e=>{document.querySelectorAll('details[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details[open]').forEach(d=>d.open=false)});
</script></body></html>
